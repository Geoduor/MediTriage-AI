# ---------------------------------------------------------------------------
# Render Blueprint - MediTriage AI backend (Person 1: DevOps)
#
# Deploy:
#   1. Push this repo to GitHub.
#   2. Render dashboard -> New -> Blueprint -> select the repo.
#   3. Render reads this file and creates the service.
#   4. Set GEMINI_API_KEY in the dashboard (it is NOT stored here).
#
# The service deliberately does not depend on an API key being present: with no
# key, LLM_MODE=auto falls back to the deterministic rule engine and triage
# still works. Gemini is the recommended provider (free tier, no credit card,
# strong Swahili); groq/ollama/anthropic are supported via LLM_PROVIDER.
# ---------------------------------------------------------------------------
services:
  - type: web
    name: medi-triage-backend
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # auto = use the LLM when a key exists, otherwise stay deterministic.
      # Production: off = never call LLM (fast, no rate limits, no cost).
      # Override per-request with use_llm=true if needed (not recommended for prod).
      - key: LLM_MODE
        value: off
      # gemini (recommended) | groq | ollama | anthropic | none
      - key: LLM_PROVIDER
        value: gemini
      # Google AI Studio free tier (no credit card). Current IDs and free-tier
      # limits: https://dev.to/hiyoyok/gemini-api-cheatsheet-2026-free-tier-limits-models-and-endpoints-in-one-place-2god
      # gemini-2.5-flash-preview is fast and good at Swahili; alternatives:
      # gemini-2.5-pro-preview, gemini-2.0-flash-lite.
      - key: LLM_MODEL
        value: gemini-2.5-flash-preview
      - key: LLM_TIMEOUT_SECONDS
        value: "20"
      # Set this to your Vercel URL after the frontend is deployed.
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://medi-triage.vercel.app
      # sync: false means Render prompts for the value instead of storing it.
      # Free key: https://aistudio.google.com/apikey
      - key: GEMINI_API_KEY
        sync: false
